services:
  app:
    build: .
    image: id-forecasting-api:latest
    container_name: id-forecasting-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-forecasting}
      DB_ECHO: ${DB_ECHO:-false}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-}
      VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen2.5-3B-Instruct}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      VLLM_TIMEOUT_SEC: ${VLLM_TIMEOUT_SEC:-30}
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s

  forecast-worker:
    image: id-forecasting-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-forecasting}
      DB_ECHO: ${DB_ECHO:-false}
      FORECAST_WORKER_POLL_SEC: ${FORECAST_WORKER_POLL_SEC:-1}
    command: ["/app/.venv/bin/python", "-m", "app.workers.forecast_worker"]
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro

  db:
    image: postgres:16-alpine
    container_name: id-forecasting-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-forecasting}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-forecasting}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
