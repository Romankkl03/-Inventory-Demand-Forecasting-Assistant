<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f7fb; margin: 0; }
        .wrap { max-width: 420px; margin: 10vh auto; background: #fff; border-radius: 8px; padding: 22px; box-shadow: 0 1px 6px rgba(0,0,0,.1); }
        input, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
        button { border: none; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
        .err { color: #b91c1c; margin-top: 8px; }
    </style>
</head>
<body>
<div class="wrap">
    <h2>Вход</h2>
    <form method="post" action="/login">
        <label>Email</label>
        <input type="email" name="email" required />
        <label>Пароль</label>
        <input type="password" name="password" required />
        <button type="submit">Войти</button>
    </form>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <p>Нет аккаунта? <a href="/signup">Создать</a></p>
</div>
</body>
</html>
