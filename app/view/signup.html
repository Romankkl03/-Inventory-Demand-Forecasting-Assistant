<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f7fb; margin: 0; }
        .wrap { max-width: 420px; margin: 10vh auto; background: #fff; border-radius: 8px; padding: 22px; box-shadow: 0 1px 6px rgba(0,0,0,.1); }
        input, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
        button { border: none; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
        .err { color: #b91c1c; margin-top: 8px; }
    </style>
</head>
<body>
<div class="wrap">
    <h2>Create account</h2>
    <form method="post" action="/signup">
        <label>Name</label>
        <input type="text" name="name" required />
        <label>Email</label>
        <input type="email" name="email" required />
        <label>Password</label>
        <input type="password" name="password" minlength="6" required />
        <button type="submit">Sign up</button>
    </form>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <p>Already have an account? <a href="/login">Sign in</a></p>
</div>
</body>
</html>
